[project]
name = "02-image-text-editor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "pyside6==6.11.1",
]

[dependency-groups]
