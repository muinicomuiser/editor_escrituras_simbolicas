    "black==26.5.1",
    "poethepoet>=0.48.0",
    "pytest==8.1.1",
    "ruff==0.3.4",
]

[tool.poe.tasks]
format = "ruff format ."
lint = "ruff check ."
start = "python src/main.py"
test = "pytest"
